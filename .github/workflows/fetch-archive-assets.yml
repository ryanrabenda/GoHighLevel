name: Fetch archived Tarzan Treescaping site assets

# One-time (re-runnable) job: crawls the Wayback Machine capture of the
# original tarzantreescaping.com site and downloads its real HTML pages,
# text content, and image/CSS assets into archive-snapshot/, then commits
# them to this branch. This dev sandbox's network policy blocks direct
# requests to web.archive.org, so the fetch runs on GitHub's runners
# instead. Trigger manually from the Actions tab; safe to delete once the
# real assets have been extracted and incorporated into the site.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/tarzan-treescaping-redesign-qur4zs
    paths:
      - "scripts/fetch-archive-assets.py"
      - ".github/workflows/fetch-archive-assets.yml"

permissions:
  contents: write

jobs:
  fetch-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Crawl archived site
        run: python scripts/fetch-archive-assets.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive-snapshot
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fetch real archived Tarzan Treescaping site assets"
            git push
          fi
